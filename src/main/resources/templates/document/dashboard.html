<!DOCTYPE html>
<html lang="lv" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::section})}">
<body>

<section>
    <style>
        /* Drag & Drop zonas stili */
        .drop-zone {
            border: 2px dashed #0d6efd;
            border-radius: 0.5rem;
            padding: 3rem 1rem;
            text-align: center;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .drop-zone.dragover {
            background-color: #e9ecef;
            border-color: #198754;
        }

        .drop-zone-icon {
            font-size: 3rem;
            color: #0d6efd;
            margin-bottom: 1rem;
        }
    </style>

    <div class="d-flex justify-content-between align-items-end mb-2">
        <h2 class="h4 mb-0">Ienākošā korespondence 2026</h2>
        <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#newCardModal">
            + Pievienot jaunu ierakstu
        </button>
    </div>

    <div class="row">
        <!-- Tabula tagad aizņem visu platumu (col-12) -->
        <div class="col-12">
            <div class="card shadow-sm border-top-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <!-- Noņemts text-nowrap, lai gari virsraksti varētu lūzt jaunā rindā -->
                        <table class="table table-hover table-bordered align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <!-- Fiksēts 20% platums pirmajai kolonnai -->
                                <th style="width: 20%; min-width: 200px;">Virsraksts / Apraksts</th>
                                <th>Numurs</th>

                                <!-- DINAMISKĀS KOLONNAS (Virsraksti) -->
                                <th th:each="field : ${dynamicFields}" th:text="${field.name}"></th>

                                <th class="text-center">Failu skaits</th>
                                <th>Izveidoja</th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- DOKUMENTU DATI (Sakārtoti no jaunākā uz vecāko) -->
                            <tr th:each="card : ${documentCards}">
                                <!-- word-break nodrošina, ka pat viens ļoti garš vārds nesalauzīs platumu -->
                                <td style="word-break: break-word;">
                                    <!-- Noņemts fw-bold, lai teksts būtu normālā biezumā -->
                                    <a th:href="@{'/documents/cards/' + ${card.id}}"
                                       class="text-decoration-none text-primary"
                                       th:text="${card.title}"></a>
                                </td>
                                <!-- Pārējām kolonnām atgriežam text-nowrap, lai datumi un numuri neietu divās rindās -->
                                <td class="text-nowrap"><span class="text-muted" th:text="${card.documentNumber}"></span></td>

                                <!-- DINAMISKĀS VĒRTĪBAS NO JSONB AR FORMATĒŠANU -->
                                <td class="text-nowrap" th:each="field : ${dynamicFields}">
                                    <th:block th:if="${card.metadata != null and card.metadata[field.name] != null and card.metadata[field.name] != ''}">
                                        <th:block th:switch="${field.type}">
                                            <span th:case="'DATE'"
                                                  th:text="${#temporals.format(T(java.time.LocalDate).parse(#strings.substring(card.metadata[field.name], 0, 10)), 'dd.MM.yyyy')}">
                                            </span>
                                            <span th:case="*" th:text="${card.metadata[field.name]}"></span>
                                        </th:block>
                                    </th:block>
                                    <!-- Ja vērtība ir tukša, parādam svītriņu -->
                                    <th:block th:unless="${card.metadata != null and card.metadata[field.name] != null and card.metadata[field.name] != ''}">
                                        <span class="text-muted fst-italic">-</span>
                                    </th:block>
                                </td>

                                <td class="text-center text-nowrap">
                                    <span class="badge bg-secondary rounded-pill" th:text="${card.files.size()}">0</span>
                                </td>
                                <td class="text-nowrap" th:text="${card.createdBy}"></td>
                            </tr>

                            <!-- Ja saraksts ir tukšs -->
                            <tr th:if="${#lists.isEmpty(documentCards)}">
                                <td th:colspan="${dynamicFields.size() + 4}" class="text-center text-muted py-4">
                                    Šajā sarakstā vēl nav pievienots neviens dokuments.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modālais logs jaunas kartītes izveidei -->
    <div class="modal fade" id="newCardModal" tabindex="-1" aria-labelledby="newCardModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="newCardModalLabel">Jauns ieraksts</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Aizvērt"></button>
                </div>
                <div class="modal-body">
                    <form id="dynamicDocForm">
                        <!-- Slēptie pamatdati -->
                        <input type="hidden" id="documentListId" th:value="${listId}">

                        <!-- PAMATLAUKS: Virsraksts -->
                        <div th:replace="~{components/forms :: textInput(
                                id='documentTitle', label='Virsraksts / Dokumenta apraksts', name='title', value='', required=true)}"></div>

                        <hr class="my-4">

                        <!-- DINAMISKAIS CIKLS: Zīmē laukus atkarībā no to tipa (Izkārtoti 2 kolonnās) -->
                        <div class="row g-3">
                            <th:block th:each="field : ${dynamicFields}">
                                <div class="col-md-6">
                                    <th:block th:switch="${field.type}">

                                        <!-- TEXT tips -->
                                        <th:block th:case="'TEXT'">
                                            <div th:replace="~{components/forms :: textInput(
                                                    id=${'field_' + field.name}, label=${field.name}, name=${field.name}, value='', required=true)}"></div>
                                        </th:block>

                                        <!-- DATE tips -->
                                        <th:block th:case="'DATE'">
                                            <div th:replace="~{components/forms :: dateInput(
                                                    id=${'field_' + field.name}, label=${field.name}, name=${field.name}, value='', required=true)}"></div>
                                        </th:block>

                                        <!-- SELECT tips -->
                                        <th:block th:case="'SELECT'">
                                            <div th:replace="~{components/forms :: selectInput(
                                                    id=${'field_' + field.name}, label=${field.name}, name=${field.name},
                                                    optionsList=${field.options != null ? field.options['values'] : null}, selectedValue='', required=true)}"></div>
                                        </th:block>

                                        <!-- CHECKBOX tips -->
                                        <th:block th:case="'CHECKBOX'">
                                            <div th:replace="~{components/forms :: checkboxInput(
                                                    id=${'field_' + field.name}, label=${field.name}, name=${field.name}, checked=false)}"></div>
                                        </th:block>

                                        <!-- TEXTAREA tips -->
                                        <th:block th:case="'TEXTAREA'">
                                            <div th:replace="~{components/forms :: textareaInput(
                                                    id=${'field_' + field.name}, label=${field.name}, name=${field.name}, value='', required=true, rows=3)}"></div>
                                        </th:block>

                                        <!-- FILE tips -->
                                        <th:block th:case="'FILE'">
                                            <div th:replace="~{components/forms :: fileInput(
                                                    id=${'field_' + field.name}, label=${field.name}, name=${field.name}, required=false, multiple=true)}"></div>
                                        </th:block>

                                    </th:block>
                                </div>
                            </th:block>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Atcelt</button>
                    <button type="button" id="saveDocBtn" class="btn btn-success">Saglabāt sistēmā</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Vanilla JS datu savākšanai un sūtīšanai -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const saveBtn = document.getElementById('saveDocBtn');

            saveBtn.addEventListener('click', function() {
                // Formas validācija
                const form = document.getElementById('dynamicDocForm');
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                // 1. Savācam pamatdatus
                const listId = document.getElementById('documentListId').value;
                const title = document.getElementById('documentTitle').value;
                const metadata = {};

                // 2. Savācam visus dinamiskos laukus (tiem id sākas ar 'field_')
                const dynamicInputs = document.querySelectorAll("input[id^='field_'], select[id^='field_']");
                dynamicInputs.forEach(input => {
                    // Ja izmanto altInput (Flatpickr), ņemam reālo (slēpto) lauku, kam nav klases 'form-control input'
                    if (input.type !== 'hidden' || input.classList.contains('flatpickr-input')) {
                        metadata[input.name] = input.value;
                    }
                });

                // 3. Sagatavojam DTO objektu
                const payload = {
                    documentListId: parseInt(listId),
                    title: title,
                    documentNumber: "GEN-" + Math.floor(Math.random() * 1000), // Pagaidu numurs
                    createdBy: "Lietotājs", // Vēlāk ņemsim no Spring Security
                    metadata: metadata
                };

                // 4. Sūtām uz mūsu API (Fetch API)
                fetch('/api/v1/documents/cards', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                })
                    .then(response => {
                        if (!response.ok) throw new Error("Kļūda saglabājot datus!");
                        return response.json();
                    })
                    .then(data => {
                        // Pārlādējam lapu, lai uzreiz redzētu jauno ierakstu tabulā
                        window.location.reload();
                    })
                    .catch(error => {
                        alert(error.message);
                        console.error(error);
                    });
            });

        });
    </script>
</section>
</body>
</html>
